name: Check Affirm jobs

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC). GitHub may start it a few minutes late.
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # save seen_jobs.json back to the repo
  issues: write              # open an issue when new jobs appear

concurrency:
  group: check-jobs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built in, nothing to set up
        run: python check_jobs.py

      - name: Save seen jobs
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet || git commit -m "Update seen jobs"
          git push
